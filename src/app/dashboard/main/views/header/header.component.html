<mat-toolbar class="app-header">
  <a class="brand" routerLink="/dashboard/home" aria-label="Go to TodosApp home page">
    <span class="brand-icon">
      <mat-icon>check_circle</mat-icon>
    </span>
    <span class="brand-text">TodosApp</span>
  </a>

  <nav class="nav-links" aria-label="Main navigation">
    <a mat-button routerLink="/dashboard/home" routerLinkActive="active">
      <mat-icon>home</mat-icon>
      Home
    </a>
    <a mat-button routerLink="/dashboard/tasks" routerLinkActive="active">
      <mat-icon>checklist</mat-icon>
      Tasks
    </a>
  </nav>


  <span class="spacer"></span>

  <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Main menu">
    <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #menu="matMenu">
    <button mat-menu-item [matMenuTriggerFor]="theme">
      <mat-icon>color_lens</mat-icon>
      <span>Theme</span>
    </button>

    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>

  <mat-menu #theme="matMenu">
    <button mat-menu-item (click)="setTheme('light')">
      <mat-icon>light_mode</mat-icon>
      <span>Light</span>
    </button>
    <button mat-menu-item (click)="setTheme('dark')">
      <mat-icon>dark_mode</mat-icon>
      <span>Dark</span>
    </button>
    <button mat-menu-item (click)="setTheme('system')">
      <mat-icon>brightness_auto</mat-icon>
      <span>System</span>
    </button>
  </mat-menu>

</mat-toolbar>
