<div class="error-container">
  <div class="content">
    <div class="glitch-wrapper">
      <h1 class="error-code">404</h1>
    </div>

    <h2>Oops! You've drifted into deep space.</h2>
    <p>The page you're looking for has moved, been deleted, or never existed in this dimension.</p>

    <div class="actions">
      <button mat-flat-button color="primary" (click)="goHome()">
        <mat-icon>home</mat-icon>
        BACK TO REALITY
      </button>

      <a mat-stroked-button routerLink="/contact">
        <mat-icon>support_agent</mat-icon>
        REPORT ISSUE
      </a>
    </div>
  </div>

  <div class="blob-1"></div>
  <div class="blob-2"></div>
</div>
